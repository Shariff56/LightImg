<script>
        // Simple drag feedback simulation
        const draggables = document.querySelectorAll('.drag-handle');
        draggables.forEach(handle => {
            handle.addEventListener('mousedown', (e) => {
                const card = handle.closest('.relative.group');
                card.style.zIndex = '100';
                card.classList.add('shadow-2xl', 'opacity-80');
            });

            document.addEventListener('mouseup', () => {
                draggables.forEach(h => {
                    const card = h.closest('.relative.group');
                    card.style.zIndex = '1';
                    card.classList.remove('shadow-2xl', 'opacity-80');
                });
            });
        });

        // Toggle chip active state
        const chips = document.querySelectorAll('.flex-shrink-0');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.className = 'flex-shrink-0 bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-4 py-2 rounded-full border border-white/5 hover:bg-surface-variant transition-all';
                });
                chip.className = 'flex-shrink-0 bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full border border-primary/30 transition-all shadow-sm';
            });
        });
