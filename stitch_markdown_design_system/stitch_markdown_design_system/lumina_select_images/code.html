                    "outline": "#958da1",
                    "on-surface": "#e4e1e7",
                    "on-primary-fixed": "#25005a",
                    "error-container": "#93000a",
                    "on-background": "#e4e1e7",
                    "on-error-container": "#ffdad6",
                    "surface": "#1A1A22",
                    "primary-container": "#7c3aed",
                    "primary-fixed-dim": "#d2bbff",
                    "on-error": "#690005",
                    "on-tertiary-container": "#ffe0cd",
                    "surface-variant": "#353439",
                    "surface-container": "#1f1f23",
                    "tertiary-container": "#a15100",
                    "background": "#131317",
                    "primary": "#d2bbff",
                    "accent-pink": "#EC4899",
                    "text-secondary": "#A0A0AC",
                    "surface-container-low": "#1b1b1f",
                    "outline-variant": "#4a4455",
                    "surface-dim": "#131317",
                    "secondary-fixed-dim": "#adc6ff",
                    "inverse-on-surface": "#303034",
                    "surface-container-lowest": "#0e0e12",
                    "on-tertiary-fixed-variant": "#713700",
                    "on-primary-fixed-variant": "#5a00c6",
                    "on-secondary": "#002e6a",
                    "error": "#F87171",
                    "surface-tint": "#d2bbff",
                    "on-secondary-fixed-variant": "#004395",
                    "on-tertiary": "#4f2500",
                    "secondary": "#adc6ff",
                    "success": "#34D399",
                    "secondary-container": "#0566d9",
                    "secondary-fixed": "#d8e2ff",
                    "on-primary": "#3f008e",
                    "inverse-primary": "#732ee4",
                    "on-secondary-container": "#e6ecff",
                    "surface-bright": "#39393d",
                    "surface-container-highest": "#353439",
                    "on-secondary-fixed": "#001a42",
                    "text-primary": "#F5F5F7",
                    "primary-fixed": "#eaddff",
                    "on-tertiary-fixed": "#301400",
                    "surface-container-high": "#2a292e",
                    "on-surface-variant": "#ccc3d8",
                    "inverse-surface": "#e4e1e7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "12px",
                    "xxl": "32px",
                    "sm": "8px",
                    "xl": "24px",
                    "gutter": "16px",
                    "lg": "16px",
                    "margin-mobile": "16px",
                    "xs": "4px",
                    "margin-tablet": "24px"
            },
            "fontFamily": {
                    "caption": ["Inter"],
                    "display-lg": ["Sora"],
                    "body-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-caps": ["JetBrains Mono"],
                    "headline-sm": ["Sora"]
            },
            "fontSize": {
                    "caption": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "display-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0E0E12;
            color: #e4e1e7;
            -webkit-tap-highlight-color: transparent;
        }
        .image-tile-selected {
            transform: scale(0.92);
            border: 2px solid #d2bbff;
        }
        .checkmark-active {
            opacity: 1;
            transform: scale(1);
        }
        .glass-panel {
            background: rgba(26, 26, 34, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0E0E12;
        }
        ::-webkit-scrollbar-thumb {
            background: #353439;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar Content -->
<header class="w-full top-0 sticky z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-lg h-16">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant/50 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Select Images</h1>
</div>
<div class="flex items-center">
<button class="p-2 rounded-full hover:bg-surface-variant/50 active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined">filter_list</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-variant/50 active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 px-1 pt-1 pb-32">
<!-- Date Header -->
<div class="px-lg py-md">
<span class="font-label-caps text-label-caps text-text-secondary uppercase tracking-widest">Recent Photos</span>
</div>
<!-- Image Grid -->
<div class="grid grid-cols-3 gap-1" id="image-grid">
<!-- JavaScript will populate tiles here for easier multi-select simulation -->
</div>
</main>
<!-- Task-Focused Sticky Bottom Bar (Suppresses Nav Shell per Filter Rules) -->
<footer class="fixed bottom-0 w-full z-50 rounded-t-xl glass-panel border-t border-white/5 shadow-xl transition-all duration-300" id="selection-footer">
<div class="max-w-4xl mx-auto flex items-center justify-between px-lg h-24 pb-safe">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-text-primary" id="selected-count">0 images selected</span>
<span class="font-caption text-caption text-text-secondary">Batch process ready</span>
</div>
<button class="bg-gradient-to-r from-primary to-accent-pink px-8 py-4 rounded-xl font-display-lg text-headline-sm text-white shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center gap-2 group disabled:opacity-50 disabled:grayscale" disabled="" id="next-btn">
                Next
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</footer>
<script>
        const grid = document.getElementById('image-grid');
        const selectedCountEl = document.getElementById('selected-count');
        const nextBtn = document.getElementById('next-btn');
        let selectedIndices = new Set();

        const prompts = [
            "A high-resolution mobile photography shot of a sleek, dark metallic smartphone resting on a minimalist concrete surface. The lighting is moody and professional, featuring soft purple and pink neon highlights that match a premium tech aesthetic. The depth of field is shallow, focusing on the refined edges of the device.",
            "A macro shot of vibrant neon-lit circuits inside a transparent computer casing. Glowing trails of electric blue and violet energy pulse through the hardware. The atmosphere is futuristic and cybernetic, captured with a sharp professional lens that emphasizes the intricate mechanical details in a dark-mode environment.",
            "An abstract architectural photograph of a brutalist building facade at twilight. The concrete structures are bathed in deep indigo shadows and accented by sharp, warm light from interior windows. The composition is geometric and symmetrical, evoking a sense of calm strength and local-first security.",
            "A close-up of a high-end camera lens showing complex glass elements and multi-coatings that reflect a spectrum of magenta and cyan light. The background is a velvety deep black, highlighting the precision and technical excellence of the optics. The image feels tactile and professional.",
            "A stunning aerial view of a futuristic city grid at night, where the streets are mapped by glowing ribbons of purple and pink traffic lights. The urban layout looks like a digital motherboard, perfectly aligned and efficient, conveying speed and advanced utility processing.",
            "A creative flat-lay of professional digital tools including a stylus, a minimalist tablet, and geometric black blocks on a dark charcoal background. Sublte rim lighting in soft lavender defines the shapes, creating a clean, organized, and focused workspace atmosphere for a digital creator.",
            "A minimalist nature photograph of a single geometric crystalline structure glowing from within with a soft pink light. It sits on a dark obsidian base in a misty, dark environment. The contrast between the organic mystery and the sharp crystalline precision creates a sense of high-end utility.",
            "An artistic representation of data flow, showing thousands of tiny glass spheres catching light as they cascade through a dark void. The light is a gradient of electric purple to soft pink, creating a shimmering, fluid motion that feels like high-speed on-device processing.",
            "A wide-angle shot of a serene, dark-themed modern studio with high-tech displays showing complex data visualizations. The room is mostly in shadows, with the vibrant colors of the screens being the primary light source, reflecting onto polished dark floors to create a sense of premium depth.",
            "A macro detail of a premium metallic texture, showing brushed aluminum with a subtle purple tint. The light grazes the surface to reveal fine lines and precision engineering. It conveys a sense of durable, high-quality hardware and local-first reliability.",
            "A composite image of a nebula-like cloud of gas and stars, but styled with a corporate modern aesthetic. The colors are strictly limited to Lumina's brand palette of deep blacks, primary purples, and accent pinks. The image is vast, inspiring, and represents the limitless potential of utility tools.",
            "A studio portrait of a sleek, black electric vehicle's headlight, featuring intricate LED patterns. The lighting is ultra-modern, with a soft glow that creates a gradient effect on the car's body. The image represents speed, precision, and the clean energy of advanced software solutions."
        ];

        function createTile(index) {
            const container = document.createElement('div');
            container.className = 'relative aspect-square overflow-hidden bg-surface-container cursor-pointer transition-all duration-300 active:scale-95';
            container.dataset.index = index;

            const img = document.createElement('div');
            img.className = 'w-full h-full bg-cover bg-center transition-transform duration-500 hover:scale-110';
            img.style.backgroundImage = "url('placeholder')";
            img.setAttribute('data-alt', prompts[index % prompts.length]);

            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-primary/20 opacity-0 transition-opacity duration-300 flex items-center justify-center';
            overlay.id = `overlay-${index}`;

            const checkmark = document.createElement('div');
            checkmark.className = 'absolute top-2 right-2 w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center scale-0 transition-transform duration-300 shadow-lg';
            checkmark.innerHTML = '<span class="material-symbols-outlined text-lg" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
            checkmark.id = `check-${index}`;

            container.appendChild(img);
            container.appendChild(overlay);
            container.appendChild(checkmark);

            container.onclick = () => toggleSelection(index, container, overlay, checkmark);
            return container;
        }

        function toggleSelection(index, container, overlay, checkmark) {
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
                container.classList.remove('image-tile-selected', 'z-10');
                overlay.classList.add('opacity-0');
                checkmark.classList.remove('scale-100');
                checkmark.classList.add('scale-0');
            } else {
                selectedIndices.add(index);
                container.classList.add('image-tile-selected', 'z-10');
                overlay.classList.remove('opacity-0');
                checkmark.classList.add('scale-100');
                checkmark.classList.remove('scale-0');
            }
            updateFooter();
        }

        function updateFooter() {
            const count = selectedIndices.size;
            selectedCountEl.innerText = count === 1 ? '1 image selected' : `${count} images selected`;
            
            if (count > 0) {
                nextBtn.disabled = false;
                document.getElementById('selection-footer').classList.remove('translate-y-full');
            } else {
                nextBtn.disabled = true;
                // We keep it visible but disabled for this specific UI request
            }
        }

        // Initialize grid
        for (let i = 0; i < 21; i++) {
            grid.appendChild(createTile(i));
        }
    </script>
</body></html>
