<script>
        // Simple draggable visual feedback simulation
        const overlay = document.getElementById('crop-overlay');
        let isDragging = false;
        let startX, startY;

        overlay.addEventListener('mousedown', (e) => {
            isDragging = true;
            overlay.style.borderColor = '#ff5540';
            overlay.style.boxShadow = '0 0 15px rgba(255, 85, 64, 0.4), 0 0 0 2000px rgba(0,0,0,0.6)';
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                overlay.style.borderColor = '#ffd700';
                overlay.style.boxShadow = '0 0 0 2000px rgba(0,0,0,0.6)';
            }
        });

        // Ratio selector effect
        const ratioButtons = document.querySelectorAll('button.grid-cols-2');

    </script>
